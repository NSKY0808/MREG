[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mreg"
version = "0.1.0"
description = "Deterministic model release evidence gate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
evaluation = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6", "jsonschema>=4.23,<5", "bandit>=1.8,<2", "pip-audit>=2.8,<3"]

[project.scripts]
mreg = "mreg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/mreg"]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
